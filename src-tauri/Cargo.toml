[package]
name = "hearth-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hearth_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ollama talks HTTP on localhost. The request has to originate from Rust, not
# the webview: Ollama rejects the packaged app's `http://tauri.localhost`
# origin with a 403, and it would only appear to work in `tauri dev`.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Already in the tree under tauri; named here for `select!`, which is what lets
# Stop abort a model call parked on the network rather than only ignoring it.
tokio = { version = "1", features = ["sync", "macros"] }
# A real terminal needs a PTY, not piped stdio: without a TTY on the far side a
# shell won't echo, won't line-edit, and won't emit the escape sequences xterm
# renders. `run_dev`'s pipes are fine for a log; they can't back a prompt.
portable-pty = "0.9"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }

